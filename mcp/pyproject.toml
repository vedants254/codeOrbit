[project]
name = "codeorbit-mcp-server"
version = "0.1.0"
description = "MCP Server for CodeOrbit - AI-powered codebase analysis and understanding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "codeorbit>=0.1.0",
    "gitpython>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
codeorbit = { path = "../core", editable = true }
